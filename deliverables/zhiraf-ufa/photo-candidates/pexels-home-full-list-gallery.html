        t.onclick = () => {
          lbImg.src = p.large;
          lbTxt.innerHTML = '<strong>ID ' + p.id + '</strong> · ' + p.author.replace(/</g, '&lt;') + '<br><a href="' + p.page + '" target="_blank" rel="noopener" style="color:#4ab0ff">Pexels</a> · <a href="' + p.original + '" style="color:#4ab0ff" target="_blank" rel="noopener">Original</a><br><code>' + row.query + '</code>';
          lb.classList.add('open');
        };
        gr.appendChild(t);
      }
      qd.appendChild(gr);
      gd.appendChild(qd);
    }
    box.appendChild(gd);
  }
  sec.appendChild(box);
  app.appendChild(sec);
}
</script>
</body>
</html>
