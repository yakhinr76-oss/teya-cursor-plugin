<title>Pexels — подборка для главной b2b-tour</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a222d; --text: #e8edf2; --muted: #8b9aab;
    --accent: #3d9cf0; --border: #2a3544;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(15,20,25,.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 12px 20px;
  }
  header h1 { margin: 0 0 8px; font-size: 1.15rem; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: .85rem; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  nav a {
    color: var(--accent); text-decoration: none; font-size: .8rem; padding: 4px 10px;
    border: 1px solid var(--border); border-radius: 999px;
  }
  nav a:hover { background: var(--panel); }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 80px; }
  section { margin-bottom: 48px; scroll-margin-top: 100px; }
  section > h2 { font-size: 1.05rem; margin: 0 0 20px; color: var(--muted); font-weight: 500; }
  .card-block { margin-bottom: 28px; }
  .card-block h3 { margin: 0 0 10px; font-size: 1rem; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  figure {
    margin: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; cursor: zoom-in;
  }
  figure img { display: block; width: 100%; aspect-ratio: 3/2; object-fit: cover; background: #000; }
  figcaption { padding: 8px 10px; font-size: .75rem; color: var(--muted); }
  figcaption strong { color: var(--text); }
  figcaption a { color: var(--accent); }
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.88);
    flex-direction: column; align-items: center; justify-content: center; padding: 16px;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: min(96vw, 1400px); max-height: 78vh; object-fit: contain; border-radius: 6px; }
  #lightbox .meta { margin-top: 12px; text-align: center; max-width: 640px; color: var(--muted); font-size: .85rem; }
  #lightbox .meta a { color: var(--accent); }
  #lightbox button {
    position: absolute; top: 16px; right: 16px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: .9rem;
  }
  #lightbox .nav {
    position: absolute; top: 50%; transform: translateY(-50%); background: var(--panel);
    border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px 16px;
    cursor: pointer; font-size: 1.2rem;
  }
  #prev { left: 12px; } #next { right: 12px; }
</style>
</head>

</header>

//www.pexels.com/photo/illuminated-shopping-mall-in-dubai-united-arab-emirates-20874640/", "orig": "https://images.pexels.com/photos/20874640/pexels-photo-20874640.jpeg", "thumb": "https://images.pexels.com/photos/20874640/pexels-photo-20874640.jpeg?auto=compress&cs=tinysrgb&w=520&h=340&fit=crop", "large": "https://images.pexels.com/photos/20874640/pexels-photo-20874640.jpeg?auto=compress&cs=tinysrgb&w=1400", "author": "Reinier Manigbas", "alt": "Night view of Dubai Marina Mall with dynamic light trails creating a vibrant urban scene."}, {"n": 3, "id": "818775", "page": "https://www.pexels.com/photo/boats-on-body-of-water-surrounded-by-high-rise-buildings-818775/", "orig": "https://images.pexels.com/photos/818775/pexels-photo-818775.jpeg", "thumb": "https://images.pexels.com/photos/818775/pexels-photo-818775.jpeg?auto=compress&cs=tinysrgb&w=520&h=340&fit=crop", "large": "https://images.pexels.com/photos/818775/pexels-photo-818775.jpeg?auto=compress&cs=tinysrgb&w=1400", "author": "Zaib Azhar 📷", "alt": "Vibrant night view of Dubai Marina with illuminated skyscrapers reflecting on the water."}]}]}]};
const main = document.getElementById('main');
const nav = document.getElementById('nav');
let flat = [];

DATA.sections.forEach((sec, si) => {
  const sid = 'sec-' + si;
  const a = document.createElement('a');
  a.href = '#' + sid;
  a.textContent = sec.title.replace(/\*\*/g,'').slice(0, 42);
  nav.appendChild(a);

  const section = document.createElement('section');
  section.id = sid;
  const h2 = document.createElement('h2');
  h2.textContent = sec.title.replace(/\*\*/g,'');
  section.appendChild(h2);

  sec.cards.forEach(card => {
    const block = document.createElement('div');
    block.className = 'card-block';
    const h3 = document.createElement('h3');
    h3.textContent = card.name;
    block.appendChild(h3);
    const grid = document.createElement('div');
    grid.className = 'grid';
    card.photos.forEach(ph => {
      const idx = flat.length;
      flat.push({ ...ph, card: card.name, section: sec.title });
      const fig = document.createElement('figure');
      fig.dataset.idx = idx;
      fig.innerHTML = `<img loading="lazy" src="${ph.thumb}" alt="${ph.alt.replace(/"/g,'&quot;')}"/>
        <figcaption><strong>Вариант ${ph.n}</strong> · ID ${ph.id} · ${ph.author} · <a href="${ph.page}" target="_blank" rel="noopener">Pexels</a></figcaption>`;
      fig.addEventListener('click', e => { if (e.target.tagName==='A') return; openLb(idx); });
      grid.appendChild(fig);
    });
    block.appendChild(grid);
    section.appendChild(block);
  });
  main.appendChild(section);
});

const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbMeta = document.getElementById('lb-meta');
let cur = 0;
function openLb(i) { cur = i; renderLb(); lb.classList.add('open'); }
function renderLb() {
  const p = flat[cur];
  lbImg.src = p.large;
  lbImg.alt = p.alt;
  lbMeta.innerHTML = `<strong>${p.card}</strong> · вариант ${p.n} · ${p.author}<br/>
    <a href="${p.page}" target="_blank" rel="noopener">Страница Pexels</a> ·
    <a href="${p.orig}" target="_blank" rel="noopener">Original JPG</a>`;
}
document.getElementById('lb-close').onclick = () => lb.classList.remove('open');
document.getElementById('prev').onclick = () => { cur = (cur - 1 + flat.length) % flat.length; renderLb(); };
document.getElementById('next').onclick = () => { cur = (cur + 1) % flat.length; renderLb(); };
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') lb.classList.remove('open');
  if (e.key === 'ArrowLeft') { cur = (cur - 1 + flat.length) % flat.length; renderLb(); }
  if (e.key === 'ArrowRight') { cur = (cur + 1) % flat.length; renderLb(); }
});
</script>
