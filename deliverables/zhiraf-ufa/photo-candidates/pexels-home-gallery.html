<head>
<meta charset="utf-8"/>

<title>Pexels v2 — яркие карточки главной</title>
<style>
  :root { --bg:#0b1016; --panel:#151c26; --text:#eef3f8; --muted:#93a3b5; --accent:#45b6ff; --border:#263041; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:5; background:rgba(11,16,22,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:14px 18px; }
  header h1 { margin:0 0 6px; font-size:1.1rem; }
  header p { margin:0; color:var(--muted); font-size:.82rem; }
  nav { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  nav a { color:var(--accent); text-decoration:none; font-size:.78rem; padding:4px 10px; border:1px solid var(--border); border-radius:999px; }
  main { max-width:1100px; margin:0 auto; padding:20px 14px 60px; }
  section { scroll-margin-top:88px; margin-bottom:36px; }
  h2 { font-size:1rem; color:var(--muted); font-weight:600; margin:0 0 14px; }
  .card { display:grid; grid-template-columns: 1.2fr 1fr; gap:14px; background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:14px; }
  @media (max-width:800px) { .card { grid-template-columns:1fr; } }
  .card img { width:100%; height:100%; min-height:220px; object-fit:cover; display:block; cursor:zoom-in; }
  .meta { padding:14px 16px; }
  .meta h3 { margin:0 0 8px; font-size:1.05rem; }
  .meta p { margin:0 0 8px; color:var(--muted); font-size:.84rem; }
  .meta code { font-size:.75rem; color:#c5d4e8; }
  .links a { color:var(--accent); font-size:.84rem; margin-right:12px; }
  #lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:20; align-items:center; justify-content:center; padding:20px; }
  #lb.open { display:flex; }
  #lb img { max-width:96vw; max-height:88vh; object-fit:contain; }
  #lb button { position:absolute; top:14px; right:14px; }
</style>
</head>
<body>
<header>
  <h1>Pexels v2 — по 1 кадру на карточку</h1>

  <nav>

    <a href="#mow">Москва</a>
    <a href="#scenarios">Подборки</a>

</header>
<main id="app"></main>
<div id="lb"><button onclick="lb.classList.remove('open')">Закрыть</button><img id="lb-img" alt=""/></div>

const lb=document.getElementById('lb');
const lbImg=document.getElementById('lb-img');
const titles={ufa:'Направления · вылет из Уфы', mow:'Направления · вылет из Москвы', scenarios:'Готовые подборки'};
for (const key of ['ufa','mow','scenarios']) {
  const sec=document.createElement('section'); sec.id=key;
  sec.innerHTML='<h2>'+titles[key]+'</h2>';
  for (const c of DATA[key]||[]) {
    const el=document.createElement('article'); el.className='card';
    el.innerHTML=`<img src="${c.thumb}" alt="" loading="lazy" data-full="${c.large2x}"/>
      <div class="meta"><h3>${c.title}</h3><p>${c.alt}</p><p><code>${c.query_used}</code></p>
      <p class="links"><a href="${c.page}" target="_blank" rel="noopener">Pexels ${c.id}</a>
      <a href="${c.original}" target="_blank" rel="noopener">Original</a> · ${c.width}×${c.height} · ${c.author}</p></div>`;

  }
  app.appendChild(sec);
